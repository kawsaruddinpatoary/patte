{% load static %} 

<section class="gap no-top products-section">
  <div class="container">
    <div class="information">
      <h3>Related Products</h3>
      <div class="boder-bar"></div>
    </div>
    <div class="row">
        {% for suggestion in suggestions %}
            <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="healthy-product mb-lg-0">
                    <div class="healthy-product-img">
                        <img src="{{suggestion.images.all.first.image.url}}" alt="suggestion.title">
                        <ul class="star">
                          {% for i in "12345" %}
                            {% if forloop.counter <= suggestion.rating %}
                              <li><i class="fa-solid fa-star"></i></li>
                            {% endif %}
                          {% endfor %}
                        </ul>
                        <div class="add-to-cart">
                          <a href="{% url 'add-to-cart' suggestion.id %}">Add to Cart</a>
                        </div>
                    </div>
                    <span>{{suggestion.categories.all.first.category}}</span>
                    <a href="{% url 'product-details' suggestion.id %}">{{suggestion.title}}</a>
                    <h6>${{suggestion.price}}</h6>
                </div>
            </div>
        {% endfor %}
    </div>
  </div>
</section>
